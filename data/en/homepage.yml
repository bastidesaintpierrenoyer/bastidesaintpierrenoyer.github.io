about:
  title: "About us"
  desc: "We are Bernard and Anne, and we have lived in this family bastide since 2009. We recently renovated the main house to make it available to holidaymakers and remote workers who want to enjoy nature. The house is at the foot of the Sainte-Baume massif, a regional natural park. Many excursions are available from the bastide without needing a car. You can hike to the sources of the Huveaune, the Saint-Clair chapel, or even reach the Sainte-Baume cave by walking on forest trails without encountering a single dwelling."
  image: "assets/img/jardin.jpg"

